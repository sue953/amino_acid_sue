<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛋白质的结构 · 3D 交互课堂</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark"><span></span><span></span><span></span></div>
      <div class="btxt">
        <h1>蛋白质的结构</h1>
        <p>沪科版2020 必修1 · 第2章第2节《蛋白质和核酸是重要的生物大分子》</p>
      </div>
    </div>
    <div class="acts">
      <button id="btnSpin" class="tb">自动旋转：开</button>
      <button id="btnLabel" class="tb">标签：显示</button>
      <button id="btnFull" class="tb">全屏投影</button>
    </div>
  </header>

  <main>
    <aside class="panel">
      <div class="card">
        <div class="card-h">学习步骤</div>
        <nav id="steps" class="steps"></nav>
      </div>

      <div class="card">
        <div class="card-h">课堂互动</div>
        <div id="ctlBox"></div>
        <div id="statBox"></div>
      </div>

      <div class="card info">
        <h2 id="iTitle"></h2>
        <p id="iLead" class="lead"></p>
        <ul id="iPoints" class="pts"></ul>
        <div class="exam"><span class="tag">考点提示</span><div id="iExam"></div></div>
      </div>
    </aside>

    <section id="stage" class="stage">
      <div id="viewport">
        <div id="labels"></div>
      </div>
      <div class="stagefoot">
        <div class="hint">左键拖动旋转 · 滚轮缩放 · 右键拖动平移 &nbsp;|&nbsp; ← → 切换步骤 · 空格 播放/暂停</div>
        <div class="nav">
          <button id="btnPrev" class="btn">← 上一步</button>
          <button id="btnNext" class="btn primary">下一步 →</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="data/proteins.js"></script>
<script src="js/mol.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
